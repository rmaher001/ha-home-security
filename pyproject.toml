[project]
name = "ha-home-security"
version = "0.1.0"
description = "Home Assistant integration for the Home Security engine (development tooling only)"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.375",
    # The frontend component (a dependency) needs its built files to set up in tests.
    "home-assistant-frontend==20260930.5",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# Home Assistant entity classes declare their attributes as mutable class defaults.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Tests poll for socket-driven updates on purpose.
"tests/*" = ["ASYNC110"]
